name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in web/*.js tests/*.test.mjs tests/*.test.cjs; do
            node --check "$file"
          done

      - name: Run JavaScript tests
        run: node --test tests/*.test.*
