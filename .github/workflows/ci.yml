name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Retain the Go build cache; module downloads are disabled below.
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::Go files need formatting. Run: gofmt -w cmd internal"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        run: GOPROXY=off go test -mod=vendor ./...

      - name: Run race detector
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
        run: GOPROXY=off go test -mod=vendor -race ./...

      - name: Run go vet
        if: ${{ !cancelled() }}
        run: GOPROXY=off go vet -mod=vendor ./...

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in web/*.js tests/*.test.mjs tests/*.test.cjs; do
            node --check "$file"
          done

      - name: Run JavaScript tests
        run: node --test tests/*.test.*
