name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inspect every commit introduced by this PR, not just its final diff
      # or the synthetic merge commit created by GitHub.
      - name: Select pull request commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          range="${merge_base}..${HEAD_SHA}"
          echo "GITLEAKS_LOG_OPTS=$range" >> "$GITHUB_ENV"
          echo "Scanning $(git rev-list --count "$range") PR commits"

      - name: Select pushed commits
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # Unusual new/replaced refs: fail safe by scanning all available history.
            echo "GITLEAKS_LOG_OPTS=--all" >> "$GITHUB_ENV"
            echo "Previous commit unavailable; scanning all reachable history"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
            echo "GITLEAKS_LOG_OPTS=$range" >> "$GITHUB_ENV"
            echo "Scanning $(git rev-list --count "$range") pushed commits"
          fi

      - name: Fetch refs for full audit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull-heads/*'
          echo "GITLEAKS_LOG_OPTS=--all" >> "$GITHUB_ENV"

      - name: Scan selected commits (redacted output)
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact --log-opts="$GITLEAKS_LOG_OPTS" .
